spring.application.name=estudos-backend
server.port=${SERVER_PORT:8080}

# Importa automaticamente variáveis de um arquivo .env local (no diretório atual ou raiz do repositório) se existir
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

management.endpoints.web.exposure.include=health,info
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/estudos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:estudos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:estudos-dev-only}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuração centralizada do provedor OpenAI (exclusivo no backend)
app.ai.openai.enabled=${OPENAI_ENABLED:true}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1/chat/completions}
app.ai.openai.connect-timeout-seconds=${OPENAI_CONNECT_TIMEOUT_SECONDS:10}
app.ai.openai.request-timeout-seconds=${OPENAI_REQUEST_TIMEOUT_SECONDS:45}
app.ai.openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:1200}
app.ai.openai.max-input-chars=${OPENAI_MAX_INPUT_CHARS:40000}
app.ai.openai.max-requests-per-minute=${OPENAI_MAX_REQUESTS_PER_MINUTE:20}

# Tarefas agendadas (agente de vagas). Desligado no perfil de testes.
app.scheduling.enabled=${SCHEDULING_ENABLED:true}

# Mensagens (inclusive de validação) sempre em português, independente do Accept-Language do cliente.
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Upload de materiais: 10 MB por arquivo e por requisição (o padrão do Spring é 1 MB). O MaterialFileStorage usa
# o mesmo max-file-size para PDF/DOCX/PPTX; texto e código-fonte ficam limitados a 2 MB.
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:10MB}

# Provedor Anthropic (Claude) — SDK oficial. Chave somente via variável de ambiente.
app.ai.anthropic.enabled=${ANTHROPIC_ENABLED:true}
app.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic.model=${ANTHROPIC_MODEL:claude-opus-5-5}
app.ai.anthropic.effort=${ANTHROPIC_EFFORT:low}

# Provedor padrão das operações de IA sem rota salva em Configurações › Provedores de IA: openai | anthropic | gemini.
# Vazio: o primeiro com chave configurada (ordem OpenAI, Anthropic, Gemini).
app.ai.provider=${AI_PROVIDER:}

# Provedor Google Gemini. Chave somente via variável de ambiente.
app.ai.gemini.enabled=${GEMINI_ENABLED:true}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.ai.gemini.request-timeout-seconds=${GEMINI_REQUEST_TIMEOUT_SECONDS:60}
app.ai.gemini.max-requests-per-minute=${GEMINI_MAX_REQUESTS_PER_MINUTE:10}

# Cache de respostas de IA (resumos, tópicos, correções e análises): evita repetir a mesma chamada.
app.ai.cache.enabled=${AI_CACHE_ENABLED:true}
app.ai.cache.ttl-hours=${AI_CACHE_TTL_HOURS:168}

# Correção automática dos exercícios práticos (imagem construída a partir de runner/java)
estudos.runner.enabled=${RUNNER_ENABLED:true}
estudos.runner.image=${RUNNER_IMAGE:estudos-java-runner:1}
