# Perfil usado pelos testes automatizados.
# Os testes apagam as tabelas antes de cada cenário; por isso NUNCA devem usar o banco da aplicação (estudos).
# Crie o banco uma única vez com:
#   docker exec programa-estudos-ia-postgres psql -U estudos -d postgres -c "CREATE DATABASE estudos_test OWNER estudos;"
spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/estudos_test}
