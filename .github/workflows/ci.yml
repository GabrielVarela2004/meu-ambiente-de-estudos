# Integração contínua: testes do backend (com PostgreSQL) e lint, build e testes do frontend.
# Nenhuma chave real é usada: o perfil de teste deixa os provedores de IA sem chave e nenhum teste chama APIs externas.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 + PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        # Credenciais do perfil de teste: usuário e senha padrão de application.properties,
        # banco estudos_test de application-test.properties.
        env:
          POSTGRES_DB: estudos_test
          POSTGRES_USER: estudos
          POSTGRES_PASSWORD: estudos-dev-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estudos -d estudos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Garantir permissão de execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Testes do backend
        run: ./mvnw -B test
        env:
          TEST_DATASOURCE_URL: jdbc:postgresql://localhost:5432/estudos_test
          SPRING_DATASOURCE_USERNAME: estudos
          SPRING_DATASOURCE_PASSWORD: estudos-dev-only

      - name: Relatórios dos testes (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (lint, build e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Testes
        run: npm run test:run
